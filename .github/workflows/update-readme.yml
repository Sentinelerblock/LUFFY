name: update-readme
on:
  workflow_dispatch:
    inputs:
      push:
        description: Push transformed README
        required: false
        default: 'false'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name Scan and transform
        run: |
          python3 - <<'PY'
          import re, pathlib, os
          root = pathlib.Path('.')
          all_todos=[]
          for p in sorted(root.rglob('*.py')):
              if '.git' in p.parts: continue
              try: lines=p.read_text().splitlines()
              except Exception: continue
              for i,l in enumerate(lines,1):
                  if 'TODO' in l:
                      all_todos.append(f'{p.as_posix()}:{i}:{l.strip()}')
          print('ALL_TODOS_BEGIN')
          print('\n'.join(all_todos))
          print('ALL_TODOS_END')
          print('TODO_COUNT', len(all_todos))

          targets = [
              'luffy/deepscaler/utils.py',
              'luffy/verl/verl/protocol.py',
          ]
          entry_re = re.compile(r'^- \[ \] \*\*(?P<path>.*?):(?P<line>\d+)\*\* - (?P<text>.*)$')
          readme = pathlib.Path('README.md')
          lines = readme.read_text().splitlines()
          for target in targets:
              p=pathlib.Path(target)
              entries=[]
              for i,l in enumerate(p.read_text().splitlines(),1):
                  m=re.search(r'#\s*TODO\b(?P<rest>.*)', l)
                  if not m: continue
                  rest=m.group('rest')
                  text=re.sub(r'^[\s:/-]+', '', rest).strip()
                  entries.append((i, text))
              new_block=[f'- [ ] **{target}:{i}** - {text}' for i,text in entries]
              idxs=[]
              for idx,l in enumerate(lines):
                  m=entry_re.match(l)
                  if m and m.group('path') == target:
                      idxs.append(idx)
              print('TARGET', target, 'current', len(entries), 'old_readme', len(idxs))
              if idxs:
                  assert idxs == list(range(min(idxs), max(idxs)+1)), f'non-contiguous old entries for {target}'
                  start,end=min(idxs),max(idxs)+1
                  print('OLD_BLOCK_BEGIN')
                  print('\n'.join(lines[start:end]))
                  print('OLD_BLOCK_END')
                  lines[start:end] = new_block
              else:
                  # Insert before first entry with greater path; otherwise before section end.
                  anchor=len(lines)
                  for idx,l in enumerate(lines):
                      m=entry_re.match(l)
                      if m and m.group('path') > target:
                          anchor=idx; break
                  lines[anchor:anchor] = new_block
              print('NEW_BLOCK_BEGIN')
              print('\n'.join(new_block))
              print('NEW_BLOCK_END')
          readme.write_text('\n'.join(lines)+'\n')
          PY
      - name: Show diff
        run: git diff -- README.md
      - name: Commit and push
        if: ${{ inputs.push == 'true' }}
        env:
          PUSH: ${{ inputs.push }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          if git diff --cached --quiet; then echo 'No README changes'; exit 0; fi
          git commit -m "docs: update TODO list from dev scan"
          git push origin HEAD:readme-dev-sync
