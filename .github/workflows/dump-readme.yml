name: dump-readme
"on":
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name Scan TODOs
        run: |
          echo ALL_TODOS_BEGIN
          grep -RIn --include='*.py' TODO . || true
          echo ALL_TODOS_END
