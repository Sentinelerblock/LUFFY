name: dump-readme
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name Transform README
        run: git fetch origin main --depth=1 && git show FETCH_HEAD:transform_readme.py > transform_readme.py && python3 transform_readme.py
      - name Show README diff
        run: git diff -- README.md
